[flake8]
max-line-length = 99

[yapf]
# PEP 8 with a 99-column limit. The rest keeps short lists, tuples and call arguments packed:
# yapf fills a line with as many items as fit and only then starts the next one, instead of
# putting every item of a long list or argument list on a line of its own.
based_on_style = pep8
column_limit = 99
split_before_first_argument = true
split_before_named_assigns = false
split_arguments_when_comma_terminated = false
split_all_comma_separated_values = false
allow_split_before_default_or_named_assigns = false
disable_ending_comma_heuristic = true
