name: Tests

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # The runner has no GPU. Qt's media backend still tries DXVA2 hardware decoding, fails 30+ times per run
      # and once hung inside a QMediaPlayer test. Decode in software (no effect on the shipped app).
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: none
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock

      # The exact versions the exe is built with (requirements-build.txt lists the loose ones).
      - name: Install the pinned requirements
        run: python -m pip install -r requirements-build.lock

      # Fails when the bundled ffmpeg is no longer the build licenses/FFMPEG-NOTICE.txt describes.
      - name: Check that the ffmpeg notice matches the bundled ffmpeg
        run: python build_exe.py --check-ffmpeg

      - name: Use the ffmpeg that ships in the exe
        shell: bash
        run: |
          ffmpeg="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
          echo "FFMPEG_PATH=$ffmpeg" >> "$GITHUB_ENV"
          "$ffmpeg" -version | head -n 1

      - name: Run the tests
        shell: bash
        # If a test ever hangs, dump every thread's stack after 20 minutes and fail (the suite takes about 4).
        run: >-
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(1200, exit=True);
          unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])"
