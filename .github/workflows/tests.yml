name: Tests

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # The runner has no GPU. Qt's media backend still tries DXVA2 hardware decoding, fails 30+ times per run
      # and once hung inside a QMediaPlayer test. Decode in software (no effect on the shipped app).
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: none
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock

      # The exact versions the exe is built with (requirements-build.txt lists the loose ones).
      - name: Install the pinned requirements
        run: python -m pip install -r requirements-build.lock

      # The style (PEP 8, 99 columns) is flake8 and yapf, both set up in setup.cfg.
      - name: Check the style
        run: |
          python -m flake8 video_converter tests
          python -m yapf --diff --recursive video_converter tests

      # Fails when the bundled ffmpeg is no longer the build licenses/FFMPEG-NOTICE.txt describes.
      - name: Check that the ffmpeg notice matches the bundled ffmpeg
        run: python build_exe.py --check-ffmpeg

      - name: Use the ffmpeg that ships in the exe
        shell: bash
        run: |
          ffmpeg="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
          echo "FFMPEG_PATH=$ffmpeg" >> "$GITHUB_ENV"
          "$ffmpeg" -version | head -n 1

      - name: Run the tests
        shell: bash
        timeout-minutes: 20
        # python -m tests runs the test classes on one worker process per CPU (see tests/parallel_runner.py); it
        # finds exactly the tests `unittest discover -s tests` finds. A test that runs longer than 10 minutes gets
        # every thread's stack dumped and its worker ended, which fails the run, and the step is stopped after
        # 20 minutes whatever happens (on the developer PC it takes about 75 seconds; on GitHub's machines: not measured).
        run: python -X faulthandler -m tests --timeout 600 --durations 15

  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_AUDIO_BACKEND: alsa
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ffmpeg is the distribution's (6.1.1 when tested in WSL Ubuntu 24.04); the rest is what Qt needs to start without a screen.
      - name: Install ffmpeg and the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libxcb-cursor0 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0t64 libasound2t64 fonts-dejavu-core

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Install the pinned requirements
        run: python -m pip install -r requirements-build.lock

      - name: Use the system ffmpeg
        run: |
          echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          ffmpeg -version | head -n 1

      - name: Run the tests
        timeout-minutes: 20
        run: python -X faulthandler -m tests --timeout 600 --durations 15
