name: Tests

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # The runner has no GPU. Qt's media backend still tries DXVA2 hardware decoding, fails 30+ times per run
      # and once hung inside a QMediaPlayer test. Decode in software (no effect on the shipped app).
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: none
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install requirements
        run: python -m pip install -r requirements-build.txt

      - name: Use the ffmpeg that ships in the exe
        shell: bash
        run: |
          ffmpeg="$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")"
          echo "FFMPEG_PATH=$ffmpeg" >> "$GITHUB_ENV"
          "$ffmpeg" -version | head -n 1

      - name: Run the tests
        shell: bash
        # If a test ever hangs, dump every thread's stack after 20 minutes and fail (the suite takes about 4).
        run: >-
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(1200, exit=True);
          unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])"
