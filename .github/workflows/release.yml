name: Release

# Pushing a v* tag builds the exe and the installer and prepares a DRAFT release; nothing is ever published
# automatically. Run it by hand (workflow_dispatch) to just build both files and get them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the app version and compare it with the tag
        id: v
        shell: bash
        run: |
          version="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' video_converter/__init__.py | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read __version__ from video_converter/__init__.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ \"$version\" in video_converter/__init__.py. Bump the version (or retag) and try again."
              exit 1
            fi
          fi
          echo "Building version $version"

  test:
    needs: check-version
    uses: ./.github/workflows/tests.yml

  build:
    needs: [check-version, test]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      PYTHONUTF8: "1"
      # "true" switches on SignPath code signing (set the repository variable SIGNING_ENABLED); anything else = unsigned.
      SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install requirements
        run: python -m pip install -r requirements-build.txt

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup 6 could not be found or installed" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $iscc /? | Select-Object -First 2

      # Code signing is OFF unless the repository variable SIGNING_ENABLED is "true". It stays off until the owner
      # has an approved SignPath project; see docs/code-signing.md for the (config-only) switch-on steps.
      - name: Say whether the files will be signed
        shell: bash
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            echo "Code signing is ON (SignPath)."
          else
            echo "Code signing is off (repository variable SIGNING_ENABLED is not \"true\"); building unsigned files."
          fi

      - name: Build the exe and the installer
        if: env.SIGNING_ENABLED != 'true'
        run: python build_exe.py --installer

      # Signing path: build the exe, sign it, then build the installer around the signed exe, then sign the installer.
      - name: Build the exe (to be signed)
        if: env.SIGNING_ENABLED == 'true'
        run: python build_exe.py

      - name: Upload the unsigned exe
        if: env.SIGNING_ENABLED == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/Free Video Editor.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the exe with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/exe

      - name: Use the signed exe and build the installer
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          cp "signed/exe/Free Video Editor.exe" "dist/Free Video Editor.exe"
          python build_exe.py --installer-only

      - name: Upload the unsigned installer
        if: env.SIGNING_ENABLED == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/FreeVideoEditor-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer

      - name: Use the signed installer and check both signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Copy-Item "signed/installer/FreeVideoEditor-Setup-$env:VERSION.exe" "dist/FreeVideoEditor-Setup-$env:VERSION.exe" -Force
          foreach ($f in @("dist/Free Video Editor.exe", "dist/FreeVideoEditor-Setup-$env:VERSION.exe")) {
            $sig = Get-AuthenticodeSignature -FilePath $f
            "$f : $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed: $($sig.Status)" }
          }

      - name: Collect the release files
        shell: bash
        run: |
          mkdir release
          cp "dist/Free Video Editor.exe" release/FreeVideoEditor.exe
          cp "dist/FreeVideoEditor-Setup-${VERSION}.exe" "release/FreeVideoEditor-Setup-${VERSION}.exe"
          cd release
          sha256sum *.exe | tee SHA256SUMS.txt
          ls -l

      - name: Check that the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\FreeVideoEditor.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "FreeVideoEditor.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          "FreeVideoEditor.exe stayed running for 15 seconds"

      - uses: actions/upload-artifact@v4
        with:
          name: FreeVideoEditor-${{ needs.check-version.outputs.version }}
          path: release/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: [check-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FreeVideoEditor-${{ needs.check-version.outputs.version }}
          path: release

      - name: Create the draft release, or add the files to the existing one
        shell: bash
        run: |
          cd release
          {
            echo "### SHA-256"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > checksums.md
          files=("FreeVideoEditor.exe" "FreeVideoEditor-Setup-${VERSION}.exe")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading the files to it."
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if ! grep -q '^### SHA-256' <<< "$body"; then
              printf '%s\n\n%s\n' "$body" "$(cat checksums.md)" > notes.md
              gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
            else
              echo "The notes already list checksums; update them by hand:"
              cat checksums.md
            fi
          else
            {
              echo "Free Video Editor ${VERSION}"
              echo
              echo "- \`FreeVideoEditor-Setup-${VERSION}.exe\`: installer (per-user, no admin needed)"
              echo "- \`FreeVideoEditor.exe\`: portable single file, nothing to install"
              echo
              cat checksums.md
            } > notes.md
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Free Video Editor ${VERSION}" \
              --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
          cat checksums.md >> "$GITHUB_STEP_SUMMARY"
